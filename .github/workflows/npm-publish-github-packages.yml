name: Publish Plugin SDK

on:
    release:
        types: [created]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            HUSKY: 0
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/setup@v2
              with:
                  version: 11.24.0
                  runtime: node@25.9
                  require-lockfile: true
                  install: false
                  cache: true
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm run build
            - run: pnpm pack --pack-destination dist-pack
            - uses: actions/upload-artifact@v4
              with:
                  name: package
                  path: dist-pack/*.tgz

    # Same tarball goes to both registries, so they can never drift apart.
    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - registry: https://registry.npmjs.org/
                      host: registry.npmjs.org
                      token: NPM_TOKEN
                    - registry: https://npm.pkg.github.com/
                      host: npm.pkg.github.com
                      token: GITHUB_TOKEN
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: package
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Publish to ${{ matrix.host }}
              env:
                  NODE_AUTH_TOKEN: ${{ matrix.token == 'NPM_TOKEN' && secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
              run: |
                  echo "//${{ matrix.host }}/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
                  npm publish ./*.tgz --registry ${{ matrix.registry }} --access public ${{ matrix.host == 'registry.npmjs.org' && '--provenance' || '' }}
